input {
  beats {
    port => 5044
  }

  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # 필요시 데이터 변환 로직 추가
  if [type] == "lawmate" {
    mutate {
      add_field => { "[@metadata][index]" => "lawmate-logs-%{+YYYY.MM.dd}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
  }

  stdout {
    codec => rubydebug
  }
}